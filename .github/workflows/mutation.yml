name: Mutation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/check_mutation.py --min-kill-rate 90
      - run: uv sync --all-groups --locked
        working-directory: packages/harbor-hf-agents
      - run: uv run python ../../scripts/check_mutation.py --repository . --min-kill-rate 90
        working-directory: packages/harbor-hf-agents
