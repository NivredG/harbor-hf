name: Mutation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/check_mutation.py --min-kill-rate 90
      - run: uv sync --all-groups --locked
        working-directory: packages/harbor-hf-agents
      - run: uv run python ../../scripts/check_mutation.py --repository . --min-kill-rate 90
        working-directory: packages/harbor-hf-agents
